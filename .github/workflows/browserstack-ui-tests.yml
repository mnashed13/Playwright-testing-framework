name: BrowserStack UI Tests

on:
  push:
    branches:
      - main
      - develop
      - testbrowserstack
  pull_request:
    branches:
      - main
      - develop

jobs:
  browserstack-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # - name: Compile TypeScript
      #   run: npm run pretest

      - name: Install Playwright Browsers
        run: npx playwright install

      - name: Run BrowserStack Tests
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_PROJECT_NAME: Playwright Testing Framework
          BROWSERSTACK_BUILD_NAME: Playwright Build-${{ github.run_number }}-${{ github.sha }}
          BROWSERSTACK_SESSION_NAME: browserstack_${{ github.workflow }}
          BROWSERSTACK_DEBUG: true
          BROWSERSTACK_CONSOLE_LOGS: true
          BROWSERSTACK_NETWORK_LOGS: true

        run: |
          npm run test:browserstack

      - name: Upload BrowserStack Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-results
          path: |
            reports/
            test-results/

      - name: Upload Screenshots and Videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-screenshots
          path: test-results/
